[project]
name = "skill-lifecycle-lab"
version = "0.1.0"
description = "Research harness: evaluation-gated evolution of agent skills (generate → evaluate → select → promote)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.12.5",
    "typer==0.20.0",
    "httpx==0.28.1",
]

[project.scripts]
skill-lab = "skill_lab.cli:app"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", ".hermes", ".serena"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
